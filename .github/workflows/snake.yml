name: Generate Snake

on:
  schedule:
    # 17:00 UTC = 00:00 WIB (once a day at local midnight)
    - cron: "0 17 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build snake from contribution grid
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          # Colors mirror the "radical" theme used by the other cards.
          # Background stays transparent: color_background only applies to .gif
          outputs: |
            dist/snake.svg?color_dot_border=#ffffff10&color_dots=#251f38,#4a2545,#8c2f66,#c53b7f,#fe428e&color_snake=#a9fef7

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
